name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check in devcontainer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache native build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/debug/
          key: native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/**', '.dockerignore', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'simulator/Cargo.toml', 'rust-toolchain*', '.cargo/**') }}-${{ github.sha }}
          restore-keys: |
            native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/**', '.dockerignore', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'simulator/Cargo.toml', 'rust-toolchain*', '.cargo/**') }}-
      - name: Cache firmware build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: firmware/target/
          key: firmware-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/**', '.dockerignore', 'firmware/Cargo.lock', 'firmware/Cargo.toml', 'crates/**/Cargo.toml', 'firmware/rust-toolchain*', 'firmware/.cargo/**', '.cargo/**') }}-${{ github.sha }}
          restore-keys: |
            firmware-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/**', '.dockerignore', 'firmware/Cargo.lock', 'firmware/Cargo.toml', 'crates/**/Cargo.toml', 'firmware/rust-toolchain*', 'firmware/.cargo/**', '.cargo/**') }}-
      - name: Build devcontainer and run checks
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          imageName: ghcr.io/${{ github.repository }}-devcontainer
          cacheFrom: ghcr.io/${{ github.repository }}-devcontainer:latest
          push: filter
          refFilterForPush: refs/heads/main
          eventFilterForPush: push
          runCmd: just ci
      - name: Upload firmware and debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paper-mesh-firmware-${{ github.sha }}
          path: target/artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Upload simulator snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paper-mesh-simulator-${{ github.sha }}
          path: target/simulator/
          if-no-files-found: error
          retention-days: 14
