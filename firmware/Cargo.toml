[package]
name = "paper-mesh-firmware"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "paper-mesh-firmware"
path = "src/main.rs"
test = false
bench = false

[features]
radio-scan-demo = []

[dependencies]
paper-mesh-platform = { path = "../crates/platform" }
paper-mesh-app = { path = "../crates/app" }
paper-mesh-ed047tc1 = { path = "../crates/ed047tc1" }
paper-mesh-gt911 = { path = "../crates/gt911" }
paper-mesh-hid-touchpad = { path = "../crates/hid-touchpad" }
embedded-graphics = "0.8.2"
embedded-hal = "1.0.0"
heapless = "0.9.2"
bt-hci = "0.9.0"
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["log"] }
embassy-usb = { version = "0.6.0", default-features = false, features = ["log"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", default-features = false, features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
# esp-rtos uses unstable HAL APIs. Keep the compatible HAL minor release.
esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }
# UART0 connects to the GPS. Do not use UART logging as an alternative.
esp-println = { version = "0.18.0", default-features = false, features = ["esp32s3", "jtag-serial", "log-04", "critical-section"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32s3", "wifi", "ble", "unstable", "log-04"] }
esp-rtos = { version = "0.4.0", features = ["esp32s3", "embassy", "esp-radio", "esp-alloc", "log-04"] }
log = "0.4.29"
static_cell = "2.1.1"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"

[lints.clippy]
wildcard_imports = "deny"
enum_glob_use = "deny"
mem_forget = "deny"
large_stack_frames = "deny"
