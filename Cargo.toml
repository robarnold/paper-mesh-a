[workspace]
members = ["crates/power-observation", "crates/bq25896", "crates/bq27220", "crates/gnss", "crates/esp-adapters", "crates/pcf8563", "crates/app", "crates/platform", "crates/ed047tc1", "crates/gt911", "crates/hid-touchpad", "simulator"]
# Keep the Xtensa toolchain, target settings, and dependency features isolated.
exclude = ["firmware"]
resolver = "3"

[workspace.lints.clippy]
wildcard_imports = "deny"
enum_glob_use = "deny"
