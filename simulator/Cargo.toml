[package]
name = "paper-mesh-simulator"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lints]
workspace = true

[dependencies]
paper-mesh-platform = { path = "../crates/platform" }
paper-mesh-app = { path = "../crates/app" }
embedded-graphics = "0.8.2"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.54.1", features = ["rt", "macros", "net", "time"] }

[dev-dependencies]
heapless = "=0.9.3"
embassy-sync = "=0.8.0"
embedded-hal = "=1.0.0"
bt-hci = "=0.11.0"
paper-mesh-ed047tc1 = { path = "../crates/ed047tc1" }
